<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Globo Flow — sem conexão</title>
<style>
  :root { color-scheme: dark; --bg:#101216; --surface:#191D24; --line:#262C36; --fg:#F4F6F9; --mute:#A9B1BE; --accent:#2788FF; --warn:#F2B231; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  .card { max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .logo { font-weight: 800; letter-spacing: .2em; font-size: 13px; } .logo b { color: var(--accent); }
  h1 { font-size: 20px; margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  p { color: var(--mute); margin: 0 0 18px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer; min-height: 44px; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">GLOBO <b>FLOW</b></div>
    <h1><span class="dot" aria-hidden="true"></span>Você está sem conexão</h1>
    <p>Esta tela ainda não foi guardada neste dispositivo. Abra o Globo Flow uma vez com internet para que as telas e os roteiros salvos localmente fiquem disponíveis offline.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
